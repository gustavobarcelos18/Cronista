[project]
name = "cronista"
version = "0.1.0"
description = "Engine do Cronista: ingestão, análise e montagem de gameplays gravadas no OBS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "opentimelineio>=0.18.1",
    "otio-fcpx-xml-adapter>=1.0.0",
    "simpleobsws>=1.4.3",
    "pynput>=1.8.2 ; sys_platform == 'win32'",
    "numpy>=2.5.5",
    "soundfile>=0.14.0",
    "fastapi>=0.163.2",
    "uvicorn>=0.30",
]

[project.scripts]
cronista = "cronista.cli:app"

[dependency-groups]
ml = [
    "torch>=2.11,<3",
    "torchaudio>=2.11,<3",
    "faster-whisper>=1.2,<2",
    "silero-vad>=6.2,<7",
    "transformers>=5.23,<6",
    "psutil>=7,<8",
    "sentencepiece>=0.2,<1",  # tokenizer do SigLIP (busca por texto, 3B)
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "websockets>=17.4",
    "httpx>=0.28.1",
]
bench = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "pillow>=13.0.0",
    "rapidocr>=3.10.0",
    "torchvision>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cronista"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not media'"
filterwarnings = ["ignore:Testing an element's truth value:DeprecationWarning"]
markers = [
    "gpu: exige GPU (roda só em prod)",
    "media: exige mídia real (roda só em prod)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
exclude = ["src/cronista/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["opentimelineio", "opentimelineio.*"]
ignore_missing_imports = true  # a OTIO não publica tipos

[[tool.mypy.overrides]]
module = ["simpleobsws", "pynput", "pynput.*", "msgpack", "soundfile"]
ignore_missing_imports = true  # sem tipos publicados

[tool.ruff.lint.per-file-ignores]
"src/cronista/devtools/resolve_kit.py" = ["E501"]  # modelos de FCPXML: quebrar a linha estraga a leitura
"../../integrations/**" = ["E501", "RUF002"]  # scripts de spike para `prod`: mensagens longas e texto em pt-BR
"src/cronista/audio/report.py" = ["E501"]  # modelos de HTML/SVG: quebrar a linha estraga a leitura

# Ambiente de ML da Fase 2B (só `prod`): `uv sync --group ml`. Fora do `uv sync` padrão, então a CI e o `dev`
# não baixam nada disto. PyTorch vem do índice CUDA 12.8 da PyTorch (o driver do PC de casa aceita CUDA 13.x).
[tool.uv.sources]
# O índice CUDA só vale no PC de casa (Windows); em outras plataformas o torch vem do PyPI.
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
