# Ambiente dev: PC do trabalho, sem GPU. Caminhos pessoais ficam em dev.local.yaml (fora do git).
# Só o que muda por ambiente: o resto vem dos padrões de `config.py` (uma fonte só; `expected_fps` é sempre 60/1).
env: dev
data_dir: data          # relativo à raiz do repositório
preview_encoder: libx264   # CPU: o dev não tem GPU
gpu_gate: false          # sem GPU nem OBS neste PC: nunca pausa
