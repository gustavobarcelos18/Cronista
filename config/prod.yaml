# Ambiente prod: PC de casa (RTX 3060). Masters no HD e cache no SSD: ajustar em prod.local.yaml (fora do git).
env: prod
data_dir: data
ffmpeg: ffmpeg
ffprobe: ffprobe
expected_fps: "60/1"
proxy_height: 360
proxy_crf: 28
video_extensions: [".mp4", ".mkv"]
preview_encoder: h264_nvenc   # RTX 3060
preview_pre_s: 20
preview_post_s: 10
gpu_gate: true           # pausa com o OBS gravando ou aplicativo em tela cheia
# gpu_busy_percent: 70     # opcional: também pausa se outro programa usar a GPU (nvidia-smi); decidir na 1C
gpu_poll_seconds: 5
log_level: INFO
