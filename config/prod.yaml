# Ambiente prod: PC de casa (RTX 3060). Masters no HD e cache no SSD: ajustar em prod.local.yaml (fora do git).
# Só o que muda por ambiente: o resto vem dos padrões de `config.py`.
env: prod
data_dir: data
preview_encoder: h264_nvenc   # RTX 3060
gpu_gate: true           # pausa com o OBS gravando ou aplicativo em tela cheia
# gpu_busy_percent: 70     # opcional: também pausa se outro programa usar a GPU (nvidia-smi)
audio_models: true       # modelos reais de áudio (Silero, faster-whisper, AST): `uv sync --group ml`
