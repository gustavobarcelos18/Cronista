name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Instalar FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --version=9.0.2 -y --no-progress
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Nenhum caminho pessoal versionado
        shell: bash
        working-directory: .
        run: |
          if git grep -nE 'C:\\Users|/home/[a-z]|\b[A-Za-z]:[\\/][A-Za-z]' -- . ':!.github' ':!docs' ':!pnpm-lock.yaml' ':!services/engine/uv.lock' ':!services/engine/tests'; then
            echo "Caminho pessoal encontrado em arquivo versionado"; exit 1
          fi

  studio:
    name: Studio e contratos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos TypeScript dos contratos estão em dia
        run: |
          pnpm gen:contracts
          git diff --exit-code packages/contracts/types.ts
      - run: pnpm lint
      - run: pnpm typecheck
